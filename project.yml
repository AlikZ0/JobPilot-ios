name: JobPilot
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  xcodeVersion: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  JobPilot:
    type: application
    platform: iOS
    sources:
      - path: JobPilot
        excludes:
          - Info.plist
    info:
      path: JobPilot/Info.plist
      # XcodeGen regenerates Info.plist. Keep launch metadata here,
      # otherwise the manual Info.plist keys may disappear in CI.
      properties:
        CFBundleDevelopmentRegion: ru
        CFBundleDisplayName: JobPilot
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "3"
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.jobpilot
        INFOPLIST_FILE: JobPilot/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_NAME: JobPilot
  JobPilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JobPilotTests
    dependencies:
      - target: JobPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.jobpilot.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/JobPilot.app/JobPilot"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  JobPilot:
    build:
      targets:
        JobPilot: all
        JobPilotTests: [test]
    test:
      targets:
        - JobPilotTests
    archive:
      config: Release
