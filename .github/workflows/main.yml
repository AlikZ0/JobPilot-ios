name: Build JobPilot for iPhone

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run unit tests on iOS Simulator after archiving
        type: boolean
        default: false

jobs:
  ios:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Archive without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project JobPilot.xcodeproj \
            -scheme JobPilot \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/JobPilot.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            SKIP_INSTALL=NO \
            2>&1 | tee "$RUNNER_TEMP/jobpilot-build.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/JobPilot.xcarchive/Products/Applications/JobPilot.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/ipa/Payload/JobPilot.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/JobPilot-unsigned.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/JobPilot-unsigned.ipa" | tail -n 1

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: JobPilot-unsigned-IPA
          path: JobPilot-unsigned.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Unit tests (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_tests }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test \
            -project JobPilot.xcodeproj \
            -scheme JobPilot \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/jobpilot-test.log"

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JobPilot-test-log
          path: ${{ runner.temp }}/jobpilot-test.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JobPilot-build-log
          path: ${{ runner.temp }}/jobpilot-build.log
          if-no-files-found: ignore
          retention-days: 7
